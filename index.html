<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑 리스트</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 480px;
      padding: 32px 28px;
      height: fit-content;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 24px;
      text-align: center;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      padding: 11px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      color: #2d3748;
    }

    .input-row input:focus {
      border-color: #667eea;
    }

    .input-row input::placeholder {
      color: #a0aec0;
    }

    .btn-add {
      padding: 11px 18px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .btn-add:hover:not(:disabled) { background: #5a67d8; }
    .btn-add:active:not(:disabled) { transform: scale(0.97); }
    .btn-add:disabled { background: #a0aec0; cursor: not-allowed; }

    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.85rem;
      color: #718096;
    }

    .btn-clear-done {
      background: none;
      border: none;
      color: #e53e3e;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .btn-clear-done:hover:not(:disabled) { background: #fff5f5; }
    .btn-clear-done:disabled { color: #a0aec0; cursor: not-allowed; }

    .list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #f7fafc;
      border-radius: 10px;
      border: 1.5px solid #e2e8f0;
      transition: opacity 0.2s, background 0.2s;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .list li.checked {
      background: #f0fff4;
      border-color: #c6f6d5;
      opacity: 0.7;
    }

    .list li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #48bb78;
      cursor: pointer;
      flex-shrink: 0;
    }

    .item-text {
      flex: 1;
      font-size: 0.95rem;
      color: #2d3748;
      word-break: break-word;
      transition: color 0.2s;
    }

    .list li.checked .item-text {
      text-decoration: line-through;
      color: #a0aec0;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #cbd5e0;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
      line-height: 1;
    }

    .btn-delete:hover { color: #e53e3e; background: #fff5f5; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .empty {
      text-align: center;
      color: #a0aec0;
      font-size: 0.9rem;
      padding: 32px 0;
    }

    .loading-msg {
      text-align: center;
      color: #a0aec0;
      font-size: 0.9rem;
      padding: 32px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛒 쇼핑 리스트</h1>

    <div class="input-row">
      <label for="itemInput" class="sr-only">아이템 이름</label>
      <input type="text" id="itemInput" placeholder="아이템을 입력하세요..." aria-label="아이템 이름" />
      <button class="btn-add" id="btnAdd">추가</button>
    </div>

    <div class="stats">
      <span id="statsText">0개 중 0개 완료</span>
      <button class="btn-clear-done" id="btnClearDone">완료 삭제</button>
    </div>

    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" style="display:none;">아직 아이템이 없습니다.</p>
    <p class="loading-msg" id="loadingMsg">불러오는 중...</p>
  </div>

  <script>
    const SUPABASE_URL = 'https://llsthcmjbadkuatvylsd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_26vqtJLeZsULfaOiMjmwnA_pc1Vpptq';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let items = [];
    let loading = false;

    function setLoading(val) {
      loading = val;
      document.getElementById('btnAdd').disabled = val;
      document.getElementById('btnClearDone').disabled = val;
    }

    function render() {
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      const loadingMsg = document.getElementById('loadingMsg');
      const statsText = document.getElementById('statsText');

      loadingMsg.style.display = 'none';
      list.innerHTML = '';

      if (items.length === 0) {
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        items.forEach((item) => {
          const li = document.createElement('li');
          if (item.checked) li.classList.add('checked');

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = item.checked;
          checkbox.addEventListener('change', () => toggleItem(item.id));

          const span = document.createElement('span');
          span.className = 'item-text';
          span.textContent = item.text;

          const btnDel = document.createElement('button');
          btnDel.className = 'btn-delete';
          btnDel.title = '삭제';
          btnDel.textContent = '✕';
          btnDel.addEventListener('click', () => deleteItem(item.id));

          li.append(checkbox, span, btnDel);
          list.appendChild(li);
        });
      }

      const total = items.length;
      const done = items.filter(i => i.checked).length;
      statsText.textContent = `${total}개 중 ${done}개 완료`;
    }

    async function loadItems() {
      const { data, error } = await db
        .from('shopping_items')
        .select('*')
        .order('created_at', { ascending: true });

      if (error) {
        console.error('데이터 로드 오류:', error);
        document.getElementById('loadingMsg').textContent = '데이터를 불러오지 못했습니다.';
        return;
      }
      items = data || [];
      render();
    }

    async function addItem() {
      const input = document.getElementById('itemInput');
      const text = input.value.trim();
      if (!text || loading) return;

      setLoading(true);
      const { data, error } = await db
        .from('shopping_items')
        .insert([{ text, checked: false }])
        .select()
        .single();
      setLoading(false);

      if (error) {
        console.error('추가 오류:', error);
        return;
      }
      items.push(data);
      render();
      input.value = '';
      input.focus();
    }

    async function toggleItem(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;

      const newChecked = !item.checked;
      const { error } = await db
        .from('shopping_items')
        .update({ checked: newChecked })
        .eq('id', id);

      if (error) {
        console.error('업데이트 오류:', error);
        return;
      }
      item.checked = newChecked;
      render();
    }

    async function deleteItem(id) {
      const { error } = await db
        .from('shopping_items')
        .delete()
        .eq('id', id);

      if (error) {
        console.error('삭제 오류:', error);
        return;
      }
      items = items.filter(i => i.id !== id);
      render();
    }

    async function clearDone() {
      if (loading) return;
      setLoading(true);
      const { error } = await db
        .from('shopping_items')
        .delete()
        .eq('checked', true);
      setLoading(false);

      if (error) {
        console.error('완료 삭제 오류:', error);
        return;
      }
      items = items.filter(i => !i.checked);
      render();
    }

    document.getElementById('btnAdd').addEventListener('click', addItem);
    document.getElementById('btnClearDone').addEventListener('click', clearDone);
    document.getElementById('itemInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addItem();
    });

    loadItems();
  </script>
</body>
</html>
